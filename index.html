    <!-- Apply the persisted theme before first paint. Without this the ink
         theme flashes sand for anyone who chose light, or the reverse. This
         script only toggles classes; it names no colour. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem("scaleroad_theme") || "dark";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored === "system" && prefersDark);
          root.classList.toggle("dark", dark);
          root.classList.toggle("light", !dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          root.classList.add("dark");
          root.dataset.theme = "dark";
        }
      })();
    </script>
